<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Rapo Cloud Kitchen - Supabase Test</title>
</head>
<body>

  <h2>Rapo Cloud Kitchen</h2>
  <h3>Supabase Connection Test</h3>

  <pre id="result">Starting test...</pre>

  <script>
    const resultBox = document.getElementById("result");

    function show(message) {
      resultBox.textContent = message;
    }

    window.addEventListener("error", function(event) {
      show("JavaScript error: " + event.message);
    });
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    onerror="show('ERROR: Supabase library could not load')">
  </script>

  <script>
    async function testConnection() {
      try {
        if (!window.supabase) {
          throw new Error(
            "Supabase library not loaded. Check internet connection."
          );
        }

        const SUPABASE_URL =
          "https://gsyjnyndoakzypqjiptt.supabase.co";

        const SUPABASE_KEY =
          "sb_publishable_MmwPSVKgk6F9qwqjWMzk_w_BG1G7IrG";

        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        show("Connecting to Supabase...");

        const response = await Promise.race([
          client
            .from("daily_stock")
            .select("product_id, stock_date, total_quantity, reserved_quantity")
            .eq("stock_date", "2026-11-23")
            .order("name"),
          new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error("Connection timed out")),
              15000
            )
          )
        ]);

        if (response.error) {
          throw response.error;
        }

        show(
          "SUCCESS! Supabase connected.\n\n" +
          "Products found: " + response.data.length +
          "\n\n" +
          JSON.stringify(response.data, null, 2)
        );

      } catch (error) {
        show("ERROR: " + error.message);
      }
    }

    testConnection();
  </script>

</body>
</html>
