<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Rapo Cloud Kitchen - Supabase Test</title>
</head>
<body>
  <h2>Rapo Cloud Kitchen</h2>
  <h3>Supabase Connection Test</h3>

  <pre id="result">Starting connection test...</pre>

  <script>
    function show(message) {
      document.getElementById("result").textContent =
        message;
    }

    window.addEventListener("error", function(event) {
      show("JavaScript Error: " + event.message);
    });
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    onerror="show('Error: Supabase library failed to load.')">
  </script>

  <script
    src="supabase-config.js"
    onerror="show('Error: supabase-config.js not found.')">
  </script>

  <script>
    async function testConnection() {
      try {
        if (!window.supabase) {
          throw new Error("Supabase library not loaded");
        }

        if (typeof db === "undefined") {
          throw new Error(
            "Database client is missing. Check supabase-config.js"
          );
        }

        show("Connecting to Supabase database...");

        const result = await Promise.race([
          db.from("products").select("id, name, price"),
          new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error(
                "Connection timed out after 15 seconds"
              )),
              15000
            )
          )
        ]);

        if (result.error) {
          throw result.error;
        }

        show(
          "SUCCESS! Products received:\n\n" +
          JSON.stringify(result.data, null, 2)
        );

      } catch (error) {
        show("ERROR: " + error.message);
      }
    }

    testConnection();
  </script>
</body>
</html>
